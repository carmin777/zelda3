# F4e.3b Redux in-game HUD: hearts at the top-left, horizontal magic bar
# below them, counters shifted right and the item box at the top-right. The
# .mod (mods-examples/opcoes-redux) is the source of ReduxHud and the other
# Redux features; this ini only keeps the bench independent of zelda3.ini.

[General]
Autosave = 0
ExtendedAspectRatio = 4:3
DisableFrameDelay = 1

[Graphics]
NewRenderer = 0
EnhancedMode7 = 0
NoSpriteLimits = 0
DimFlashes = 0

[Sound]
EnableAudio = 0
EnableMSU = 0
ResumeMSU = 0

[Mods]
Enabled = 0

[Features]
ItemSwitchLR = 0
ItemSwitchLRLimit = 0
TurnWhileDashing = 0
MirrorToDarkworld = 0
CollectItemsWithSword = 0
BreakPotsWithSword = 0
DisableLowHealthBeep = 0
SkipIntroOnKeypress = 0
ShowMaxItemsInYellow = 0
MoreActiveBombs = 0
CarryMoreRupees = 0
MiscBugFixes = 0
GameChangingBugFixes = 0
CancelBirdTravel = 0
NewStyleInventory = 0
HorizontalMagicBar = 0
MenuTimer = 0
ReduxHud = 0
