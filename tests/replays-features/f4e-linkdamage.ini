# Minimal configuration for the headless regression bench.
# Every feature must be off and the language must be English, otherwise the
# side-by-side comparison against the original assembly is disabled.

[General]
Autosave = 0
ExtendedAspectRatio = 4:3
DisableFrameDelay = 1
# Language is intentionally omitted: the built-in dialogue table is English.
# (The assets only carry extra translations such as "de" and "pt".)

[Graphics]
NewRenderer = 0
EnhancedMode7 = 0
NoSpriteLimits = 0
DimFlashes = 0

[Sound]
EnableAudio = 0
EnableMSU = 0
ResumeMSU = 0

[Mods]
# The bench never depends on the user's mods directory.
Enabled = 0

[Features]
ItemSwitchLR = 1
ItemSwitchLRLimit = 0
TurnWhileDashing = 0
MirrorToDarkworld = 0
CollectItemsWithSword = 0
BreakPotsWithSword = 0
DisableLowHealthBeep = 0
SkipIntroOnKeypress = 0
ShowMaxItemsInYellow = 0
MoreActiveBombs = 0
CarryMoreRupees = 0
MiscBugFixes = 0
GameChangingBugFixes = 0
CancelBirdTravel = 0
