# F4e.5 item registry: the novelty item is received from Link's house chest,
# appears in the 24-slot menu and is used from the Y button.
#
# The replay snapshot already carries kFeatures0_NewStyleInventory in its
# initial RAM, but the ini makes the intention explicit.

